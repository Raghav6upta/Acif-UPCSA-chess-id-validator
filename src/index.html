<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Player Verifier</title><style>body{margin:0;background:#f5f7fb;color:#111827;font-family:Inter,system-ui,Arial}.wrap{max-width:760px;margin:60px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 10px 35px #0000000f}h1{margin:0 0 8px}p{color:#6b7280}label{display:block;font-weight:600;margin:22px 0 8px}select,input,button{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:15px}button{margin-top:24px;background:#111827;color:#fff;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.55;cursor:wait}#status{margin-top:18px;white-space:pre-wrap}.hint{font-size:13px;margin-top:12px}</style></head><body><div class="wrap"><div class="card"><h1>Chess Player Verifier</h1><p>Upload an Excel file containing player IDs and append federation verification data.</p><form id="form"><label for="mode">Federation</label><select id="mode" name="mode"><option value="upcsa">UPCSA</option><option value="aicf">AICF</option></select><label for="file">Excel file</label><input id="file" name="file" type="file" accept=".xlsx,.xlsm,.xltx,.xltm" required><button id="submit" type="submit">Verify Players</button></form><div id="status"></div><div class="hint">UPCSA requests are deliberately slowed and retried to reduce temporary request failures.</div></div></div><script>const form=document.getElementById('form'),button=document.getElementById('submit'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Processing… this can take a while for UPCSA batches.';try{const r=await fetch('/process',{method:'POST',body:new FormData(form)});if(!r.ok){let m='Processing failed.';try{m=(await r.json()).error||m}catch(_){}throw Error(m)}const blob=await r.blob(),cd=r.headers.get('Content-Disposition')||'',m=cd.match(/filename="?([^\"]+)"?/i),name=m?m[1]:'players_verified.xlsx',url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);status.textContent='Done — the verified Excel file has been downloaded.'}catch(err){status.textContent='Error: '+err.message}finally{button.disabled=false}});</script></body></html>
